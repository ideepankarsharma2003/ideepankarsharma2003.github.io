<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f4ed">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('portfolio-theme'); } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0c0d0e' : '#f5f4ed');
    })();
  </script>
  <title>Deepankar Sharma | AI engineer &amp; product builder</title>
  <!-- metadata -->
